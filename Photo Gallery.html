<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chris Ruth Photography</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/exifr@7.1.3/dist/full.umd.js"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f8f6f3;
      --bg2: #f0ede8;
      --fg: #1c1a17;
      --fg2: #6b6560;
      --fg3: #a09890;
      --accent: #8b7355;
      --white: #ffffff;
      --nav-h: 60px;
      --serif: 'Cormorant Garamond', Georgia, serif;
      --sans: 'Jost', system-ui, sans-serif;
    }

    html, body { height: 100%; background: var(--bg); color: var(--fg); font-family: var(--sans); font-weight: 300; }
    #root { min-height: 100vh; }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--fg3); border-radius: 3px; }

    /* Nav */
    .nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      height: var(--nav-h);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 32px;
      transition: background 0.3s, box-shadow 0.3s;
    }
    .nav.solid { background: var(--bg); box-shadow: 0 1px 0 rgba(0,0,0,0.08); }
    .nav.transparent { background: transparent; }
    .nav.dark .nav-logo, .nav.dark .nav-icon { color: var(--white); }
    .nav.dark.solid .nav-logo, .nav.dark.solid .nav-icon { color: var(--fg); }
    .nav.dark .nav-center { color: var(--white); }
    .nav.dark.solid .nav-center { color: var(--fg); }

    .nav-logo {
      font-family: var(--serif); font-size: 20px; font-weight: 400; letter-spacing: 0.04em;
      cursor: pointer; text-decoration: none; color: inherit;
      background: none; border: none; transition: color 0.2s;
    }
    .nav-center {
      position: absolute; left: 50%; transform: translateX(-50%);
      font-family: var(--serif); font-size: 15px; font-weight: 400; letter-spacing: 0.08em;
      color: inherit; opacity: 0.85;
      background: none; border: none; cursor: pointer; padding: 6px 12px;
      border-radius: 4px; transition: opacity 0.2s; white-space: nowrap;
    }
    .nav-center:hover { opacity: 0.55; }
    .nav-actions { display: flex; align-items: center; gap: 20px; }
    .nav-icon {
      background: none; border: none; cursor: pointer; color: inherit;
      display: flex; align-items: center; justify-content: center;
      width: 36px; height: 36px; border-radius: 50%;
      transition: background 0.15s, color 0.2s;
    }
    .nav-icon:hover { background: rgba(0,0,0,0.07); }
    .nav-icon svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.5; }

    /* Home */
    .home-header {
      text-align: center; padding: 120px 32px 64px;
      border-bottom: 1px solid rgba(0,0,0,0.08);
    }
    .home-header h1 {
      font-family: var(--serif); font-weight: 300; font-size: clamp(36px, 5vw, 64px);
      letter-spacing: 0.02em; color: var(--fg); margin-bottom: 12px;
    }
    .home-header p { font-size: 13px; letter-spacing: 0.12em; color: var(--fg2); text-transform: uppercase; }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 2px; padding: 2px;
    }
    .gallery-card {
      position: relative; overflow: hidden; cursor: pointer;
      aspect-ratio: 4/3; background: var(--bg2);
    }
    .gallery-card img {
      width: 100%; height: 100%; object-fit: cover;
      transition: transform 0.6s cubic-bezier(0.25,0.46,0.45,0.94);
      display: block;
    }
    .gallery-card:hover img { transform: scale(1.04); }
    .gallery-card-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(10,8,5,0.72) 0%, rgba(10,8,5,0.1) 55%, transparent 100%);
      display: flex; flex-direction: column; justify-content: flex-end;
      padding: 28px 28px 26px;
    }
    .gallery-card-title {
      font-family: var(--serif); font-size: 26px; font-weight: 400; color: #fff;
      letter-spacing: 0.02em; line-height: 1.15; margin-bottom: 6px;
    }
    .gallery-card-meta { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,0.7); }
    .gallery-card-count {
      position: absolute; top: 16px; right: 16px;
      background: rgba(0,0,0,0.45); color: rgba(255,255,255,0.9);
      font-size: 11px; letter-spacing: 0.1em; padding: 4px 10px; border-radius: 20px;
      backdrop-filter: blur(4px);
    }

    /* Gallery hero */
    .gallery-hero {
      position: relative; height: 100vh; overflow: hidden;
      display: flex; align-items: flex-end; justify-content: center;
      transition: height 0.4s;
    }
    .gallery-hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .gallery-hero-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.65) 0%, rgba(0,0,0,0.05) 50%, transparent 100%);
    }
    .gallery-hero-content {
      position: relative; z-index: 2;
      text-align: center; padding-bottom: 80px; padding-left: 32px; padding-right: 32px;
    }
    .gallery-hero-content h1 {
      font-family: var(--serif); font-weight: 300; font-size: clamp(40px, 6vw, 88px);
      color: #fff; letter-spacing: 0.03em; line-height: 1.05; margin-bottom: 14px;
    }
    .gallery-hero-content p { font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(255,255,255,0.75); }
    .hero-scroll-hint {
      position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%);
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      color: rgba(255,255,255,0.6); font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase;
      animation: fadeInUp 1.2s ease 0.8s both;
    }
    .hero-scroll-hint svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.5; animation: bounce 2s infinite; }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(5px); } }
    @keyframes fadeInUp { from { opacity: 0; transform: translateX(-50%) translateY(16px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

    /* Sets nav */
    .sets-nav {
      background: var(--white); border-bottom: 1px solid rgba(0,0,0,0.08);
      display: flex; align-items: center; justify-content: center;
      padding: 0 32px; gap: 0; position: sticky; top: var(--nav-h); z-index: 90;
      overflow-x: auto; scrollbar-width: none;
    }
    .sets-nav::-webkit-scrollbar { display: none; }
    .set-tab {
      background: none; border: none; cursor: pointer;
      font-family: var(--sans); font-size: 11px; font-weight: 400;
      letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg2);
      padding: 18px 20px; border-bottom: 2px solid transparent;
      white-space: nowrap; transition: color 0.2s, border-color 0.2s;
    }
    .set-tab:hover { color: var(--fg); }
    .set-tab.active { color: var(--fg); border-bottom-color: var(--fg); }

    /* Photo grid */
    .photo-grid { columns: 3; column-gap: 3px; padding: 3px; max-width: 1600px; margin: 0 auto; }
    @media (max-width: 900px) { .photo-grid { columns: 2; } }
    @media (max-width: 560px) { .photo-grid { columns: 1; } }

    .photo-item {
      break-inside: avoid; margin-bottom: 3px; position: relative;
      cursor: pointer; overflow: hidden; display: block; background: var(--bg2);
    }
    .photo-item img {
      width: 100%; display: block;
      transition: transform 0.5s cubic-bezier(0.25,0.46,0.45,0.94), filter 0.3s;
    }
    .photo-item:hover img { transform: scale(1.03); filter: brightness(0.92); }
    .photo-item-overlay {
      position: absolute; inset: 0; display: flex; align-items: flex-end; justify-content: flex-end;
      padding: 12px; opacity: 0; transition: opacity 0.2s;
    }
    .photo-item:hover .photo-item-overlay { opacity: 1; }
    .heart-btn {
      width: 34px; height: 34px; border-radius: 50%; border: none;
      background: rgba(0,0,0,0.4); backdrop-filter: blur(4px);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background 0.15s, transform 0.15s;
    }
    .heart-btn:hover { background: rgba(0,0,0,0.6); transform: scale(1.1); }
    .heart-btn svg { width: 15px; height: 15px; stroke: #fff; fill: none; stroke-width: 1.8; transition: fill 0.15s; }
    .heart-btn.liked svg { fill: #e05555; stroke: #e05555; }

    /* Lightbox */
    .lightbox {
      position: fixed; inset: 0; z-index: 300;
      background: rgba(8,7,5,0.97);
      display: flex; align-items: center; justify-content: center;
      animation: lbIn 0.22s ease;
    }
    @keyframes lbIn { from { opacity: 0; } to { opacity: 1; } }
    .lightbox-img { max-width: 92vw; max-height: 92vh; object-fit: contain; display: block; animation: lbImgIn 0.25s ease; }
    @keyframes lbImgIn { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: scale(1); } }
    .lb-close {
      position: fixed; top: 20px; right: 20px; z-index: 10;
      width: 44px; height: 44px; border-radius: 50%; border: none;
      background: rgba(255,255,255,0.1); backdrop-filter: blur(6px);
      cursor: pointer; color: #fff; display: flex; align-items: center; justify-content: center;
      transition: background 0.15s;
    }
    .lb-close:hover { background: rgba(255,255,255,0.2); }
    .lb-close svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.5; }
    .lb-arrow {
      position: fixed; top: 50%; transform: translateY(-50%);
      width: 52px; height: 52px; border-radius: 50%; border: none;
      background: rgba(255,255,255,0.08); backdrop-filter: blur(6px);
      cursor: pointer; color: #fff; display: flex; align-items: center; justify-content: center;
      transition: background 0.15s; z-index: 10;
    }
    .lb-arrow:hover { background: rgba(255,255,255,0.18); }
    .lb-arrow svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.5; }
    .lb-prev { left: 20px; }
    .lb-next { right: 20px; }
    .lb-meta {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      color: rgba(255,255,255,0.5); font-size: 12px; letter-spacing: 0.1em;
      display: flex; align-items: center; gap: 20px;
    }
    .lb-meta span { white-space: nowrap; }
    .lb-heart {
      background: none; border: none; cursor: pointer; color: rgba(255,255,255,0.6);
      display: flex; align-items: center; gap: 6px; font-size: 12px; letter-spacing: 0.08em;
      transition: color 0.15s;
    }
    .lb-heart:hover { color: #fff; }
    .lb-heart.liked { color: #e05555; }
    .lb-heart svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; transition: fill 0.15s; }
    .lb-heart.liked svg { fill: #e05555; }

    /* Footer */
    .gallery-footer {
      text-align: center; padding: 48px 32px;
      border-top: 1px solid rgba(0,0,0,0.08); margin-top: 16px;
    }
    .gallery-footer p { font-size: 12px; letter-spacing: 0.1em; color: var(--fg3); }

    /* Toast */
    .toast {
      position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
      background: var(--fg); color: var(--white);
      font-size: 12px; letter-spacing: 0.08em; padding: 10px 20px;
      border-radius: 24px; z-index: 400;
      animation: toastIn 0.3s ease, toastOut 0.3s ease 1.8s forwards;
      pointer-events: none;
    }
    @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
    @keyframes toastOut { to { opacity: 0; transform: translateX(-50%) translateY(10px); } }

    .back-btn {
      background: none; border: none; cursor: pointer; font-family: var(--sans);
      font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--fg2); display: flex; align-items: center; gap: 6px;
      padding: 6px 0; transition: color 0.15s;
    }
    .back-btn:hover { color: var(--fg); }
    .back-btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.5; }

    /* Admin */
    .admin-badge {
      font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--accent); padding: 4px 10px; border: 1px solid var(--accent);
      border-radius: 20px; margin-right: 8px;
    }
    .admin-login-btn {
      background: none; border: 1px solid currentColor; cursor: pointer;
      color: inherit; font-family: var(--sans);
      font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
      padding: 7px 14px; border-radius: 20px;
      display: flex; align-items: center; gap: 6px;
      transition: background 0.15s, color 0.15s, opacity 0.15s;
      opacity: 0.85;
    }
    .admin-login-btn:hover { opacity: 1; background: rgba(0,0,0,0.05); }
    .nav.dark:not(.solid) .admin-login-btn:hover { background: rgba(255,255,255,0.12); }
    .admin-login-btn svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 1.8; }
    .modal-backdrop {
      position: fixed; inset: 0; z-index: 500; background: rgba(8,7,5,0.7);
      display: flex; align-items: center; justify-content: center;
      animation: lbIn 0.2s ease; padding: 20px;
    }
    .modal {
      background: var(--white); border-radius: 8px; max-width: 560px; width: 100%;
      max-height: 90vh; overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .modal-header {
      padding: 24px 28px 16px; border-bottom: 1px solid rgba(0,0,0,0.08);
      display: flex; align-items: center; justify-content: space-between;
    }
    .modal-header h2 {
      font-family: var(--serif); font-weight: 400; font-size: 22px; letter-spacing: 0.02em;
    }
    .modal-close {
      background: none; border: none; cursor: pointer; color: var(--fg2);
      width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s;
    }
    .modal-close:hover { background: rgba(0,0,0,0.06); color: var(--fg); }
    .modal-close svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.5; }
    .modal-body { padding: 20px 28px 28px; }
    .form-row { margin-bottom: 14px; }
    .form-row label {
      display: block; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--fg2); margin-bottom: 6px;
    }
    .form-row input[type="text"], .form-row input[type="password"], .form-row input[type="url"],
    .form-row textarea {
      width: 100%; padding: 10px 12px; border: 1px solid rgba(0,0,0,0.15);
      border-radius: 4px; font-family: var(--sans); font-size: 13px; color: var(--fg);
      background: var(--white); outline: none; transition: border-color 0.15s;
    }
    .form-row input:focus, .form-row textarea:focus { border-color: var(--accent); }
    .form-row textarea { min-height: 70px; resize: vertical; }
    .form-error {
      font-size: 12px; color: #c44; margin-top: 8px;
    }
    .btn-primary {
      background: var(--fg); color: var(--white); border: none;
      padding: 10px 20px; border-radius: 4px; cursor: pointer;
      font-family: var(--sans); font-size: 12px; letter-spacing: 0.08em;
      text-transform: uppercase; transition: background 0.15s;
    }
    .btn-primary:hover { background: var(--accent); }
    .btn-secondary {
      background: transparent; color: var(--fg); border: 1px solid rgba(0,0,0,0.15);
      padding: 10px 20px; border-radius: 4px; cursor: pointer;
      font-family: var(--sans); font-size: 12px; letter-spacing: 0.08em;
      text-transform: uppercase; transition: background 0.15s;
    }
    .btn-secondary:hover { background: rgba(0,0,0,0.04); }
    .btn-danger {
      background: transparent; color: #c44; border: 1px solid #c44;
      padding: 10px 20px; border-radius: 4px; cursor: pointer;
      font-family: var(--sans); font-size: 12px; letter-spacing: 0.08em;
      text-transform: uppercase; transition: all 0.15s;
    }
    .btn-danger:hover { background: #c44; color: var(--white); }
    .btn-row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; flex-wrap: wrap; }

    .gallery-card-edit {
      position: absolute; top: 16px; left: 16px;
      background: rgba(0,0,0,0.55); color: rgba(255,255,255,0.95);
      font-size: 11px; letter-spacing: 0.1em; padding: 6px 12px; border-radius: 20px;
      backdrop-filter: blur(4px); border: none; cursor: pointer;
      text-transform: uppercase; transition: background 0.15s;
    }
    .gallery-card-edit:hover { background: rgba(0,0,0,0.75); }

    .new-gallery-card {
      aspect-ratio: 4/3; background: var(--bg2);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      cursor: pointer; border: 2px dashed rgba(0,0,0,0.15);
      transition: background 0.15s, border-color 0.15s;
    }
    .new-gallery-card:hover { background: var(--bg); border-color: var(--accent); }
    .new-gallery-card .plus {
      font-family: var(--serif); font-size: 48px; font-weight: 300; color: var(--fg2);
      line-height: 1;
    }
    .new-gallery-card .label {
      font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--fg2); margin-top: 12px;
    }

    .photo-edit-list {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 8px; margin-top: 8px;
    }
    .photo-edit-item {
      position: relative; aspect-ratio: 4/3; background: var(--bg2);
      overflow: hidden; border-radius: 4px;
    }
    .photo-edit-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .photo-edit-remove {
      position: absolute; top: 4px; right: 4px;
      width: 22px; height: 22px; border-radius: 50%; border: none;
      background: rgba(0,0,0,0.65); color: #fff; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; line-height: 1;
    }
    .photo-edit-remove:hover { background: #c44; }
    .photo-add-row { display: flex; gap: 8px; margin-top: 10px; }
    .photo-add-row input { flex: 1; }
    .set-block {
      border: 1px solid rgba(0,0,0,0.08); border-radius: 6px;
      padding: 14px; margin-bottom: 14px; background: var(--bg);
    }
    .set-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 10px; gap: 8px;
    }
    .set-header input {
      flex: 1; padding: 6px 10px; border: 1px solid rgba(0,0,0,0.12);
      border-radius: 4px; font-family: var(--sans); font-size: 13px;
      background: var(--white);
    }

    /* EXIF panel */
    .exif-toggle {
      position: fixed; top: 20px; left: 20px; z-index: 10;
      background: rgba(255,255,255,0.1); backdrop-filter: blur(6px);
      color: #fff; border: none; padding: 8px 14px; border-radius: 20px;
      font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
      cursor: pointer; transition: background 0.15s;
    }
    .exif-toggle:hover { background: rgba(255,255,255,0.2); }
    .exif-toggle.active { background: rgba(139,115,85,0.5); }
    .exif-panel {
      position: fixed; top: 76px; left: 20px; z-index: 10;
      max-width: 280px; padding: 16px 18px;
      background: rgba(20,18,15,0.85); backdrop-filter: blur(8px);
      color: #fff; border-radius: 8px; font-size: 12px; line-height: 1.6;
      animation: lbIn 0.2s ease;
    }
    .exif-panel h4 {
      font-family: var(--serif); font-size: 14px; font-weight: 400;
      margin-bottom: 8px; padding-bottom: 6px;
      border-bottom: 1px solid rgba(255,255,255,0.15);
      letter-spacing: 0.05em;
    }
    .exif-panel .row {
      display: flex; justify-content: space-between; gap: 12px;
      color: rgba(255,255,255,0.85);
    }
    .exif-panel .row .k { color: rgba(255,255,255,0.55); font-size: 11px; letter-spacing: 0.06em; }
    .exif-panel .empty { color: rgba(255,255,255,0.5); font-style: italic; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "gridColumns": "4",
  "heroHeight": "tall",
  "accentColor": "#8b7355",
  "navStyle": "transparent",
  "photoSpacing": "comfortable"
}/*EDITMODE-END*/;

const PHOTOGRAPHER = "Chris Ruth";
const ADMIN_PASSWORD = "admin"; // demo password — client-side gate only
const GALLERY_STORAGE_KEY = "gallery_data_v1";

function makePhotos(seeds, setLabel) {
  return seeds.map((seed, i) => ({
    id: `${setLabel}-${i}`,
    src: `https://picsum.photos/seed/${seed}/1200/900`,
    thumb: `https://picsum.photos/seed/${seed}/600/450`,
    w: seed % 3 === 0 ? 900 : 1200,
    h: seed % 3 === 0 ? 1200 : (seed % 2 === 0 ? 800 : 900),
  }));
}

function uid(prefix) {
  return `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 7)}`;
}

function loadImageDims(url) {
  return new Promise((resolve) => {
    const img = new Image();
    let done = false;
    const finish = (dims) => { if (done) return; done = true; resolve(dims); };
    img.onload = () => finish({ w: img.naturalWidth || null, h: img.naturalHeight || null });
    img.onerror = () => finish({ w: null, h: null });
    setTimeout(() => finish({ w: null, h: null }), 15000);
    img.src = url;
  });
}

function useAdmin() {
  const [isAdmin, setIsAdmin] = useState(() => {
    try { return sessionStorage.getItem('admin_session') === '1'; } catch { return false; }
  });
  const login = useCallback((pw) => {
    if (pw === ADMIN_PASSWORD) {
      try { sessionStorage.setItem('admin_session', '1'); } catch {}
      setIsAdmin(true);
      return true;
    }
    return false;
  }, []);
  const logout = useCallback(() => {
    try { sessionStorage.removeItem('admin_session'); } catch {}
    setIsAdmin(false);
  }, []);
  return { isAdmin, login, logout };
}

function useGalleries(initial) {
  const [galleries, setGalleries] = useState(() => {
    try {
      const stored = localStorage.getItem(GALLERY_STORAGE_KEY);
      if (stored) return JSON.parse(stored);
    } catch {}
    return initial;
  });
  const persist = useCallback((next) => {
    setGalleries(next);
    try { localStorage.setItem(GALLERY_STORAGE_KEY, JSON.stringify(next)); } catch {}
  }, []);
  const reset = useCallback(() => {
    try { localStorage.removeItem(GALLERY_STORAGE_KEY); } catch {}
    setGalleries(initial);
  }, [initial]);
  return [galleries, persist, reset];
}

function GalleryEditor({ gallery, isNew, onClose, onSave, onDelete }) {
  const [draft, setDraft] = useState(() => {
    if (gallery) return JSON.parse(JSON.stringify(gallery));
    return {
      id: uid('gal'),
      title: '', subtitle: '', cover: '', coverThumb: '',
      date: '', location: '',
      sets: [{ id: 'all', label: 'All Photos', photos: [] }],
    };
  });
  const [error, setError] = useState('');

  const update = (patch) => setDraft(d => ({ ...d, ...patch }));

  // Photos are always added to the main "All Photos" set (sets[0]).
  // Any other sub-sets (e.g. "Ceremony", "Reception") on existing galleries
  // are preserved untouched.
  const mainPhotos = draft.sets[0]?.photos || [];

  const addPhoto = async (url, thumbUrl) => {
    if (!url) return;
    const probeUrl = thumbUrl || url;
    const { w, h } = await loadImageDims(probeUrl);
    const photo = { id: uid('p'), src: url, thumb: thumbUrl || url, w, h };
    setDraft(d => {
      const sets = d.sets.length
        ? d.sets.map((s, i) => i === 0 ? { ...s, photos: [...s.photos, photo] } : s)
        : [{ id: 'all', label: 'All Photos', photos: [photo] }];
      return { ...d, sets };
    });
  };

  const removePhoto = (photoId) => setDraft(d => ({
    ...d,
    sets: d.sets.map((s, i) => i === 0 ? { ...s, photos: s.photos.filter(p => p.id !== photoId) } : s),
  }));

  const handleSave = () => {
    if (!draft.title.trim()) { setError('Title is required'); return; }
    if (!draft.cover.trim()) { setError('Cover image URL is required'); return; }
    const cleaned = {
      ...draft,
      coverThumb: draft.coverThumb || draft.cover,
      sets: draft.sets.length ? draft.sets : [{ id: 'all', label: 'All Photos', photos: [] }],
    };
    onSave(cleaned);
  };

  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal" style={{maxWidth: 720}} onClick={e => e.stopPropagation()}>
        <div className="modal-header">
          <h2>{isNew ? 'New Gallery' : 'Edit Gallery'}</h2>
          <button className="modal-close" onClick={onClose}>{Icon.close()}</button>
        </div>
        <div className="modal-body">
          <div className="form-row">
            <label>Title *</label>
            <input type="text" value={draft.title} onChange={e => update({title: e.target.value})} placeholder="e.g. Sarah & James" />
          </div>
          <div className="form-row">
            <label>Subtitle</label>
            <input type="text" value={draft.subtitle} onChange={e => update({subtitle: e.target.value})} placeholder="e.g. Engagement · July 2024 · Marin Headlands, CA" />
          </div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}>
            <div className="form-row">
              <label>Date</label>
              <input type="text" value={draft.date} onChange={e => update({date: e.target.value})} placeholder="July 6, 2024" />
            </div>
            <div className="form-row">
              <label>Location</label>
              <input type="text" value={draft.location} onChange={e => update({location: e.target.value})} placeholder="Marin Headlands, CA" />
            </div>
          </div>
          <div className="form-row">
            <label>Cover Image URL *</label>
            <input type="url" value={draft.cover} onChange={e => update({cover: e.target.value, coverThumb: draft.coverThumb || e.target.value})} placeholder="https://..." />
          </div>
          <div className="form-row">
            <label>Cover Thumbnail URL (optional)</label>
            <input type="url" value={draft.coverThumb} onChange={e => update({coverThumb: e.target.value})} placeholder="Defaults to cover URL" />
          </div>

          <div style={{marginTop:24,marginBottom:10}}>
            <label style={{fontSize:11,letterSpacing:'0.1em',textTransform:'uppercase',color:'var(--fg2)'}}>
              Photos <span style={{color:'var(--fg3)',marginLeft:6,letterSpacing:'0.04em',textTransform:'none'}}>
                ({mainPhotos.length})
              </span>
            </label>
          </div>

          <PhotoListEditor
            photos={mainPhotos}
            onAddPhoto={addPhoto}
            onRemovePhoto={removePhoto}
          />

          {error && <div className="form-error">{error}</div>}

          <div className="btn-row">
            {!isNew && onDelete && (
              <button className="btn-danger" onClick={() => {
                if (window.confirm(`Delete gallery "${draft.title}"? This cannot be undone.`)) onDelete();
              }} style={{marginRight:'auto'}}>Delete Gallery</button>
            )}
            <button className="btn-secondary" onClick={onClose}>Cancel</button>
            <button className="btn-primary" onClick={handleSave}>Save</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function PhotoListEditor({ photos, onAddPhoto, onRemovePhoto }) {
  const [url, setUrl] = useState('');
  const [thumb, setThumb] = useState('');
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');

  const submit = async (e) => {
    if (e) e.preventDefault();
    const u = url.trim();
    if (!u) return;
    setBusy(true); setErr('');
    try {
      await onAddPhoto(u, thumb.trim());
      setUrl(''); setThumb('');
    } catch (ex) {
      setErr('Failed to add photo');
    } finally {
      setBusy(false);
    }
  };

  return (
    <div className="set-block">
      {photos.length > 0 && (
        <div className="photo-edit-list">
          {photos.map(p => (
            <div key={p.id} className="photo-edit-item">
              <img src={p.thumb} alt="" loading="lazy" />
              <button type="button" className="photo-edit-remove" title="Remove photo"
                onClick={() => onRemovePhoto(p.id)}>×</button>
            </div>
          ))}
        </div>
      )}
      <form className="photo-add-row" onSubmit={submit}>
        <input type="url" placeholder="Photo URL (https://...)" value={url}
          onChange={e => setUrl(e.target.value)} disabled={busy} />
        <input type="url" placeholder="Thumbnail URL (optional)" value={thumb}
          onChange={e => setThumb(e.target.value)} style={{maxWidth:200}} disabled={busy} />
        <button type="submit" className="btn-secondary" style={{whiteSpace:'nowrap'}} disabled={busy}>
          {busy ? 'Adding…' : '+ Add'}
        </button>
      </form>
      {err && <div className="form-error">{err}</div>}
    </div>
  );
}

/* ── EXIF Panel ── */
function ExifPanel({ src }) {
  const [data, setData] = useState(null);
  const [status, setStatus] = useState('loading');
  useEffect(() => {
    let cancelled = false;
    setStatus('loading'); setData(null);
    if (typeof window.exifr === 'undefined') {
      setStatus('error');
      return;
    }
    window.exifr.parse(src, { tiff: true, exif: true, gps: false })
      .then(d => {
        if (cancelled) return;
        if (!d || Object.keys(d).length === 0) setStatus('empty');
        else { setData(d); setStatus('ok'); }
      })
      .catch(() => { if (!cancelled) setStatus('error'); });
    return () => { cancelled = true; };
  }, [src]);

  const fmtShutter = (v) => {
    if (!v) return null;
    if (v >= 1) return `${v}s`;
    return `1/${Math.round(1 / v)}s`;
  };
  const fmtDate = (d) => {
    if (!d) return null;
    try { return new Date(d).toLocaleString(); } catch { return String(d); }
  };

  const rows = [];
  if (data) {
    const camera = [data.Make, data.Model].filter(Boolean).join(' ').trim();
    if (camera) rows.push(['Camera', camera]);
    if (data.LensModel) rows.push(['Lens', data.LensModel]);
    if (data.FocalLength) rows.push(['Focal', `${Math.round(data.FocalLength)}mm`]);
    if (data.FNumber) rows.push(['Aperture', `f/${data.FNumber}`]);
    const shutter = fmtShutter(data.ExposureTime);
    if (shutter) rows.push(['Shutter', shutter]);
    if (data.ISO) rows.push(['ISO', data.ISO]);
    const date = fmtDate(data.DateTimeOriginal || data.CreateDate);
    if (date) rows.push(['Taken', date]);
    if (data.ImageWidth && data.ImageHeight) rows.push(['Dimensions', `${data.ImageWidth} × ${data.ImageHeight}`]);
  }

  return (
    <div className="exif-panel" onClick={e => e.stopPropagation()}>
      <h4>EXIF</h4>
      {status === 'loading' && <div className="empty">Reading metadata…</div>}
      {status === 'error' && <div className="empty">Couldn't read EXIF (CORS or unsupported source)</div>}
      {status === 'empty' && <div className="empty">No EXIF data in this image</div>}
      {status === 'ok' && rows.length === 0 && <div className="empty">No common EXIF tags found</div>}
      {status === 'ok' && rows.map(([k, v]) => (
        <div className="row" key={k}>
          <span className="k">{k}</span>
          <span>{v}</span>
        </div>
      ))}
    </div>
  );
}

      </button>
      {isAdmin && (
        <button className={`exif-toggle ${showExif ? 'active' : ''}`}
          onClick={e => { e.stopPropagation(); setShowExif(s => !s); }}
          title="Toggle EXIF data (i)">
          <span style={{display:'inline-flex',alignItems:'center',gap:6}}>
            <span style={{width:14,height:14,display:'inline-block'}}>{Icon.info()}</span>
            EXIF
          </span>
        </button>
      )}
      {isAdmin && showExif && <ExifPanel src={photo.src} />}
      {index > 0 && (
        <button className="lb-arrow lb-prev" onClick={e => { e.stopPropagation(); onPrev(); }}>
          <span style={{width:20,height:20,display:'block'}}>{Icon.chevLeft()}</span>
        </button>
      )}
      <img key={photo.id} className="lightbox-img" src={photo.src} alt="" onClick={e => e.stopPropagation()} />
      {index < photos.length - 1 && (
        <button className="lb-arrow lb-next" onClick={e => { e.stopPropagation(); onNext(); }}>
          <span style={{width:20,height:20,display:'block'}}>{Icon.chevRight()}</span>
        </button>
      )}
      <div className="lb-meta" onClick={e => e.stopPropagation()}>
        <span>{index + 1} / {photos.length}</span>
        <button className={`lb-heart ${liked ? 'liked' : ''}`} onClick={() => onLike(photo.id)}>
          <span style={{width:16,height:16,display:'block'}}>{Icon.heart(liked)}</span>
          <span>{liked ? 'Liked' : 'Like'}</span>
        </button>
        <button className="lb-heart">
          <span style={{width:16,height:16,display:'block'}}>{Icon.download()}</span>
          <span>Download</span>
        </button>
      </div>
    </div>
  );
}

/* ── Photo Grid ── */
function PhotoGrid({ photos, likedIds, onPhotoClick, onLike }) {
  return (
    <div className="photo-grid">
      {photos.map((photo, i) => {
        const isLiked = likedIds.has(photo.id);
        const imgStyle = photo.w && photo.h
          ? { aspectRatio: `${photo.w} / ${photo.h}` }
          : undefined;
        return (
          <div key={photo.id} className="photo-item" onClick={() => onPhotoClick(i)}>
            <img src={photo.thumb} alt="" loading="lazy" style={imgStyle} />
            <div className="photo-item-overlay">
              <button className={`heart-btn ${isLiked ? 'liked' : ''}`}
                onClick={e => { e.stopPropagation(); onLike(photo.id); }}>
                <span style={{width:15,height:15,display:'block'}}>{Icon.heart(isLiked)}</span>
              </button>
            </div>
          </div>
        );
      })}
    </div>
  );
}

/* ── Gallery View ── */
function GalleryView({ gallery, likedIds, onLike, onBack, showToast, heroHeight, navStyle,
                       isAdmin, onLoginClick, onLogout, onEditGallery }) {
  const [activeSet, setActiveSet] = useState('all');
  const [lightbox, setLightbox] = useState(null);
  const [showFavs, setShowFavs] = useState(false);
  const [scrolled, setScrolled] = useState(false);

  useEffect(() => {
    const fn = () => setScrolled(window.scrollY > 60);
    window.addEventListener('scroll', fn, { passive: true });
    return () => window.removeEventListener('scroll', fn);
  }, []);

  const currentSet = gallery.sets.find(s => s.id === activeSet) || gallery.sets[0];
  const photos = showFavs ? currentSet.photos.filter(p => likedIds.has(p.id)) : currentSet.photos;
  const heroH = heroHeight === 'full' ? '100vh' : heroHeight === 'half' ? '55vh' : '75vh';
  const alwaysSolid = navStyle === 'always-solid';

  const openLightbox = useCallback((i) => setLightbox(i), []);
  const closeLightbox = useCallback(() => setLightbox(null), []);
  const prevPhoto = useCallback(() => setLightbox(i => Math.max(0, i - 1)), []);
  const nextPhoto = useCallback(() => setLightbox(i => Math.min(photos.length - 1, i + 1)), [photos.length]);

  return (
    <div>
      <Nav
        view="gallery"
        galleryTitle={gallery.title}
        onHome={onBack}
        transparent={!alwaysSolid}
        dark={!alwaysSolid}
        scrolled={scrolled || alwaysSolid}
        favorites={showFavs}
        onToggleFavs={() => setShowFavs(f => !f)}
        isAdmin={isAdmin}
        onLoginClick={onLoginClick}
        onLogout={onLogout}
      />

      {/* Hero */}
      <div className="gallery-hero" style={{height: heroH}}>
        <img src={gallery.cover} alt={gallery.title} />
        <div className="gallery-hero-overlay" />
        <div className="gallery-hero-content">
          <h1>{gallery.title}</h1>
          <p>{gallery.date} &nbsp;·&nbsp; {gallery.location}</p>
        </div>
        <div className="hero-scroll-hint">
          <span>Scroll</span>
          <span style={{width:16,height:16,display:'block'}}>{Icon.chevDown()}</span>
        </div>
      </div>

      {/* Sets nav */}
      {gallery.sets.length > 1 && (
        <div className="sets-nav">
          {gallery.sets.map(s => (
            <button key={s.id} className={`set-tab ${activeSet === s.id ? 'active' : ''}`}
              onClick={() => { setActiveSet(s.id); setShowFavs(false); }}>
              {s.label} <span style={{opacity:0.45,marginLeft:4}}>{s.photos.length}</span>
            </button>
          ))}
        </div>
      )}

      {/* Back / Edit */}
      <div style={{padding:'20px 24px 4px',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <button className="back-btn" onClick={onBack}>
          <span style={{width:14,height:14,display:'block'}}>{Icon.chevLeft()}</span>
          All Galleries
        </button>
        {isAdmin && onEditGallery && (
          <button className="btn-secondary" onClick={() => onEditGallery(gallery)}
            style={{display:'flex',alignItems:'center',gap:6,padding:'8px 14px'}}>
            <span style={{width:14,height:14,display:'block'}}>{Icon.edit()}</span>
            Edit Gallery
          </button>
        )}
      </div>

      {/* Favorites empty state */}
      {showFavs && photos.length === 0 && (
        <div style={{textAlign:'center',padding:'80px 32px',color:'var(--fg2)'}}>
          <p style={{fontFamily:'var(--serif)',fontSize:22,marginBottom:8}}>No favorites yet</p>
          <p style={{fontSize:12,letterSpacing:'0.08em'}}>Hover over a photo and click the heart to save favorites</p>
        </div>
      )}

      <div style={{paddingTop:8}}>
        <PhotoGrid photos={photos} likedIds={likedIds} onPhotoClick={openLightbox}
          onLike={(id) => {
            onLike(id);
            showToast(likedIds.has(id) ? 'Removed from favorites' : 'Added to favorites');
          }} />
      </div>

      <div className="gallery-footer">
        <p>© {new Date().getFullYear()} {PHOTOGRAPHER} &nbsp;·&nbsp; All rights reserved</p>
      </div>

      {lightbox !== null && photos[lightbox] && (
        <Lightbox
          photos={photos}
          index={lightbox}
          liked={likedIds.has(photos[lightbox]?.id)}
          onClose={closeLightbox}
          onPrev={prevPhoto}
          onNext={nextPhoto}
          isAdmin={isAdmin}
          onLike={(id) => {
            onLike(id);
            showToast(likedIds.has(id) ? 'Removed from favorites' : 'Added to favorites');
          }}
        />
      )}
    </div>
  );
}

/* ── Home View ── */
function HomeView({ galleries, onSelectGallery, isAdmin, onLoginClick, onLogout, onEditGallery, onNewGallery }) {
  const [scrolled, setScrolled] = useState(false);
  useEffect(() => {
    const fn = () => setScrolled(window.scrollY > 10);
    window.addEventListener('scroll', fn, { passive: true });
    return () => window.removeEventListener('scroll', fn);
  }, []);

  return (
    <div>
      <Nav view="home" onHome={() => {}} transparent={false} scrolled={true}
        isAdmin={isAdmin} onLoginClick={onLoginClick} onLogout={onLogout} />
      <div className="home-header">
        <h1>{PHOTOGRAPHER}</h1>
        <p>Photography &nbsp;·&nbsp; San Francisco, CA</p>
      </div>
      <div className="gallery-grid">
        {galleries.map(g => (
          <div key={g.id} className="gallery-card" onClick={() => onSelectGallery(g)}>
            <img src={g.coverThumb || g.cover} alt={g.title} loading="lazy" />
            <div className="gallery-card-overlay">
              <div className="gallery-card-title">{g.title}</div>
              <div className="gallery-card-meta">{g.subtitle}</div>
            </div>
            <div className="gallery-card-count">{(g.sets[0]?.photos.length) ?? 0} photos</div>
            {isAdmin && (
              <button className="gallery-card-edit"
                onClick={e => { e.stopPropagation(); onEditGallery(g); }}>
                Edit
              </button>
            )}
          </div>
        ))}
        {isAdmin && (
          <div className="new-gallery-card" onClick={onNewGallery}>
            <span className="plus">+</span>
            <span className="label">New Gallery</span>
          </div>
        )}
      </div>
      <div className="gallery-footer">
        <p>© {new Date().getFullYear()} {PHOTOGRAPHER} Photography</p>
      </div>
    </div>
  );
}

/* ── App ── */
function App() {
  const [view, setView] = useState('home');
  const [activeGalleryId, setActiveGalleryId] = useState(null);
  const [likedIds, setLikedIds] = useState(() => {
    try { return new Set(JSON.parse(localStorage.getItem('gallery_liked') || '[]')); }
    catch { return new Set(); }
  });
  const [toast, setToast] = useState(null);
  const toastTimer = useRef(null);
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [galleries, setGalleries] = useGalleries(GALLERIES);
  const { isAdmin, login, logout } = useAdmin();
  const [showLogin, setShowLogin] = useState(false);
  const [editing, setEditing] = useState(null); // { gallery, isNew }

  const activeGallery = activeGalleryId
    ? galleries.find(g => g.id === activeGalleryId) || null
    : null;

  useEffect(() => {
    if (view === 'gallery' && activeGalleryId && !activeGallery) {
      setView('home');
      setActiveGalleryId(null);
    }
  }, [view, activeGalleryId, activeGallery]);

  useEffect(() => {
    if (!isAdmin && editing) setEditing(null);
  }, [isAdmin, editing]);

  useEffect(() => {
    document.documentElement.style.setProperty('--accent', tweaks.accentColor);
  }, [tweaks.accentColor]);

  const gap = tweaks.photoSpacing === 'tight' ? '3px' : tweaks.photoSpacing === 'comfortable' ? '8px' : '16px';
  const cols = tweaks.gridColumns;

  const showToast = useCallback((msg) => {
    setToast(msg);
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(null), 2200);
  }, []);

  const toggleLike = useCallback((id) => {
    setLikedIds(prev => {
      const next = new Set(prev);
      if (next.has(id)) next.delete(id); else next.add(id);
      localStorage.setItem('gallery_liked', JSON.stringify([...next]));
      return next;
    });
  }, []);

  const selectGallery = useCallback((g) => {
    setActiveGalleryId(g.id);
    setView('gallery');
    window.scrollTo(0, 0);
  }, []);

  const goHome = useCallback(() => {
    setView('home');
    setActiveGalleryId(null);
    window.scrollTo(0, 0);
  }, []);

  const handleLogin = useCallback((pw) => {
    if (login(pw)) { setShowLogin(false); showToast('Signed in as admin'); return true; }
    return false;
  }, [login, showToast]);

  const handleLogout = useCallback(() => {
    logout();
    showToast('Signed out');
  }, [logout, showToast]);

  const startEditGallery = useCallback((g) => setEditing({ gallery: g, isNew: false }), []);
  const startNewGallery = useCallback(() => setEditing({ gallery: null, isNew: true }), []);

  const saveGallery = useCallback((draft) => {
    setGalleries((() => {
      const exists = galleries.some(g => g.id === draft.id);
      return exists
        ? galleries.map(g => g.id === draft.id ? draft : g)
        : [...galleries, draft];
    })());
    setEditing(null);
    showToast(editing?.isNew ? 'Gallery created' : 'Gallery saved');
  }, [galleries, setGalleries, editing, showToast]);

  const deleteGallery = useCallback(() => {
    if (!editing?.gallery) return;
    const id = editing.gallery.id;
    setGalleries(galleries.filter(g => g.id !== id));
    if (activeGalleryId === id) goHome();
    setEditing(null);
    showToast('Gallery deleted');
  }, [editing, galleries, setGalleries, activeGalleryId, goHome, showToast]);

  return (
    <>
      <style>{`
        .photo-grid { columns: ${cols}; column-gap: ${gap}; padding: ${gap}; }
        .photo-item { margin-bottom: ${gap}; }
        @media (max-width: 900px) { .photo-grid { columns: ${Math.max(1, parseInt(cols) - 1)}; } }
        @media (max-width: 560px) { .photo-grid { columns: 1; } }
      `}</style>

      {view === 'home' && (
        <HomeView
          galleries={galleries}
          onSelectGallery={selectGallery}
          isAdmin={isAdmin}
          onLoginClick={() => setShowLogin(true)}
          onLogout={handleLogout}
          onEditGallery={startEditGallery}
          onNewGallery={startNewGallery}
        />
      )}
      {view === 'gallery' && activeGallery && (
        <GalleryView
          gallery={activeGallery}
          likedIds={likedIds}
          onLike={toggleLike}
          onBack={goHome}
          showToast={showToast}
          heroHeight={tweaks.heroHeight}
          navStyle={tweaks.navStyle}
          isAdmin={isAdmin}
          onLoginClick={() => setShowLogin(true)}
          onLogout={handleLogout}
          onEditGallery={startEditGallery}
        />
      )}
      {toast && <Toast msg={toast} />}

      {showLogin && (
        <AdminLoginModal
          onClose={() => setShowLogin(false)}
          onSubmit={handleLogin}
        />
      )}
      {editing && (
        <GalleryEditor
          gallery={editing.gallery}
          isNew={editing.isNew}
          onClose={() => setEditing(null)}
          onSave={saveGallery}
          onDelete={editing.isNew ? null : deleteGallery}
        />
      )}

      <TweaksPanel>
        <TweakSection label="Layout">
          <TweakRadio
            label="Photo Columns"
            value={tweaks.gridColumns}
            options={[{label:'2',value:'2'},{label:'3',value:'3'},{label:'4',value:'4'}]}
            onChange={v => setTweak('gridColumns', v)}
          />
          <TweakRadio
            label="Spacing"
            value={tweaks.photoSpacing}
            options={[{label:'Tight',value:'tight'},{label:'Comfy',value:'comfortable'},{label:'Airy',value:'airy'}]}
            onChange={v => setTweak('photoSpacing', v)}
          />
        </TweakSection>
        <TweakSection label="Hero">
          <TweakRadio
            label="Hero Height"
            value={tweaks.heroHeight}
            options={[{label:'Half',value:'half'},{label:'Tall',value:'tall'},{label:'Full',value:'full'}]}
            onChange={v => setTweak('heroHeight', v)}
          />
          <TweakRadio
            label="Nav"
            value={tweaks.navStyle}
            options={[{label:'Glass',value:'transparent'},{label:'Solid',value:'always-solid'}]}
            onChange={v => setTweak('navStyle', v)}
          />
        </TweakSection>
        <TweakSection label="Branding">
          <TweakColor
            label="Accent Color"
            value={tweaks.accentColor}
            onChange={v => setTweak('accentColor', v)}
          />
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
